<!DOCTYPE html>
<html>
<head>
  <title>Doctors App - Add Patient</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar-custom {
      background-color: #333;
    }

    .navbar-custom .nav-link {
      color: #f2f2f2;
      margin-right: 10px;
    }

    .navbar-custom .nav-link:hover {
      background-color: #575757;
      border-radius: 5px;
    }

    .navbar-custom .nav-link.active {
      background-color: #04AA6D;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand text-white" href="#">Doctors App</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Add Patient</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Patients List</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Reports</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="container mt-4">
    <div class="p-4 bg-primary text-white rounded">
      <h1>Add Patient</h1> 
      <p>Fill the form below to register a new patient.</p> 
    </div>
  </div>

  <!-- Add Patient Form -->
  <div class="container mt-4 mb-5">
    <form action="/add_patient" method="post">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="name" class="form-label">Name:</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="phone" class="form-label">Phone:</label>
          <input type="tel" class="form-control" id="phone" name="phone" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="address" class="form-label">Address:</label>
          <input type="text" class="form-control" id="address" name="address" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="gender" class="form-label">Gender:</label>
          <select class="form-select" id="gender" name="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label for="age" class="form-label">Age:</label>
          <input type="number" class="form-control" id="age" name="age" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="weight" class="form-label">Weight (kg):</label>
          <input type="text" class="form-control" id="weight" name="weight" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="bp" class="form-label">Blood Pressure:</label>
          <input type="text" class="form-control" id="bp" name="bp" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="sugar" class="form-label">Sugar Level:</label>
          <input type="text" class="form-control" id="sugar" name="sugar" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="temperature" class="form-label">Temperature (°C):</label>
          <input type="text" class="form-control" id="temperature" name="temperature" required>
        </div>

        <div class="col-12 mb-3">
          <label for="allergies" class="form-label">Allergies:</label>
          <textarea class="form-control" id="allergies" name="allergies" rows="3" required></textarea>
        </div>

        <div class="col-12 mb-3">
          <label for="doctor_id" class="form-label">Doctor ID:</label>
          <input type="text" class="form-control" id="doctor_id" name="doctor_id" required>
        </div>
      </div>

      <button type="submit" class="btn btn-success">Submit</button>
    </form>
  </div>

</body>
</html>
