<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <div class="mt-4 p-5 bg-primary text-white rounded">
    <h1>Doctors App</h1> 
    <p>Add New Consultation</p>
    <p>Welcome {{name}} | {{email}}</p>
  </div>

  <nav class="navbar navbar-expand-sm bg-light mt-3">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">View Patients</a></li>
        <li class="nav-item"><a class="nav-link" href="#">View Consultations</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="/">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="mt-4">
    <h2>Add a New Consultation</h2>
    <form action="/add-consultation-in-db" method="post">

      <div class="mb-3">
        <label for="weight" class="form-label">Weight:</label>
        <input type="text" class="form-control" id="weight" name="weight" placeholder="Enter weight">
      </div>

      <div class="mb-3">
        <label for="height" class="form-label">Height:</label>
        <input type="text" class="form-control" id="height" name="height" placeholder="Enter height">
      </div>

      <div class="mb-3">
        <label for="bp_low" class="form-label">BP Low:</label>
        <input type="number" class="form-control" id="bp_low" name="bp_low" placeholder="Enter BP Low">
      </div>

      <div class="mb-3">
        <label for="bp_high" class="form-label">BP High:</label>
        <input type="number" class="form-control" id="bp_high" name="bp_high" placeholder="Enter BP High">
      </div>

      <div class="mb-3">
        <label for="sugar" class="form-label">Blood Sugar:</label>
        <input type="number" class="form-control" id="sugar" name="sugar" placeholder="Enter Blood Sugar">
      </div>

      <div class="mb-3">
        <label for="temperature" class="form-label">Temperature:</label>
        <input type="text" class="form-control" id="temperature" name="temperature" placeholder="Enter Temperature">
      </div>

      <div class="mb-3">
        <label for="chief_complaints" class="form-label">Chief Complaints:</label>
        <input type="text" class="form-control" id="chief_complaints" name="chief_complaints" placeholder="Enter Chief Complaints">
      </div>

      <div class="mb-3">
        <label for="allergies" class="form-label">Allergies:</label>
        <input type="text" class="form-control" id="allergies" name="allergies" placeholder="Enter Allergies (if any)">
      </div>

      <div class="mb-3">
        <label for="medicines" class="form-label">Medicines:</label>
        <input type="text" class="form-control" id="medicines" name="medicines" placeholder="Enter Medicines Prescribed">
      </div>

      <div class="mb-3">
        <label for="follow_up" class="form-label">Follow Up:</label>
        <input type="date" class="form-control" id="follow_up" name="follow_up">
      </div>

      <button type="submit" class="btn btn-primary">Add Consultation</button>
    </form>
  </div>
</div>

</body>
</html>
